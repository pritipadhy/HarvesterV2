# Harvester V2 Test Environment
# Usage: docker-compose -f harvester_v2/docker-compose.test.yml up -d

version: '3.8'

services:
  # PostgreSQL for durable storage
  harvester-postgres:
    image: postgres:15-alpine
    container_name: harvester_v2_postgres
    environment:
      POSTGRES_USER: harvester
      POSTGRES_PASSWORD: harvester_test_pass
      POSTGRES_DB: harvester_v2
    ports:
      - "5433:5432"
    volumes:
      - harvester_postgres_data:/var/lib/postgresql/data
      - ./storage/postgresql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harvester -d harvester_v2"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Weaviate for vector search
  harvester-weaviate:
    image: semitechnologies/weaviate:1.23.0
    container_name: harvester_v2_weaviate
    ports:
      - "8081:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - harvester_weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching
  harvester-redis:
    image: redis:7-alpine
    container_name: harvester_v2_redis
    ports:
      - "6380:6379"
    volumes:
      - harvester_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka for event streaming (optional for full integration tests)
  harvester-kafka:
    image: bitnami/kafka:3.6
    container_name: harvester_v2_kafka
    ports:
      - "9093:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@harvester-kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - harvester_kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  harvester_postgres_data:
  harvester_weaviate_data:
  harvester_redis_data:
  harvester_kafka_data:

networks:
  default:
    name: harvester_v2_network
